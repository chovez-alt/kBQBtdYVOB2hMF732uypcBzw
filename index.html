<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f486d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JW Assistant"><title>JW Assistant</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f3f5;color:#30343a}.app{height:100dvh;display:flex;flex-direction:column}.top{background:#2f486d;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center}.top h1{margin:0;flex:1;font-size:21px}.btn,.update{border:0;border-radius:9px;padding:10px 12px;font-weight:700}.btn{background:#324e73;color:white}.update{background:#ffffff18;color:#fff;border:1px solid #ffffff55}.main{flex:1;overflow:auto}.tab{position:absolute;opacity:0;pointer-events:none}.view{display:none}#tHome:checked~.main #Home,#tBible:checked~.main #Bible,#tLib:checked~.main #Library,#tMeet:checked~.main #Meetings,#tStudy:checked~.main #Study,#tMore:checked~.main #More{display:block}.title{margin:0;padding:16px}.card{margin:0 16px 14px;background:#fff;border-radius:12px;padding:14px}.status{margin:0 16px 12px;padding:11px 12px;border-radius:9px;background:#eef4f8;color:#365d7f;font-size:13px}.actions{padding:0 16px 12px;display:flex;gap:8px;flex-wrap:wrap}.scripture{background:#fff;padding:18px 16px 8px;margin-bottom:1px}.scripture h3{font:700 22px Georgia,serif;margin:0 0 12px}.bookgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 7px;padding-bottom:10px}.book{border:0;background:transparent;padding:4px 0;text-align:left;color:#1c56b3;text-decoration:underline;font:17px Georgia,serif}.nav{display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border-top:1px solid #ccc;padding-bottom:env(safe-area-inset-bottom)}.nav label{text-align:center;padding:8px 1px;font-size:10px;color:#69717a}.nav b{display:block;font-size:20px}.list{background:#fff}.row{display:block;padding:14px 16px;border-bottom:1px solid #eee;color:inherit;text-decoration:none}.pane{position:fixed;inset:0;background:#fff;z-index:20;display:none;flex-direction:column}.pane.on{display:flex}.ptop{background:#2f486d;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;display:flex;align-items:center;gap:8px}.ptop button{border:0;background:transparent;color:#fff;font-size:24px}.ptop strong{flex:1}.chapters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:18px;overflow:auto}.chapters button{padding:13px;border:1px solid #ccd3d9;background:#fff;border-radius:8px;color:#316b9c;font-weight:700}.reader{flex:1;overflow:auto;padding:18px;font:18px/1.58 Georgia,serif}.reader .w_navigation{display:none!important}.file{display:none}</style></head><body><div class="app"><header class="top"><h1>JW Assistant</h1><button class="update" onclick="location.reload()">Update</button></header><input class="tab" type="radio" name="tabs" id="tHome" checked><input class="tab" type="radio" name="tabs" id="tBible"><input class="tab" type="radio" name="tabs" id="tLib"><input class="tab" type="radio" name="tabs" id="tMeet"><input class="tab" type="radio" name="tabs" id="tStudy"><input class="tab" type="radio" name="tabs" id="tMore"><main class="main"><section id="Home" class="view"><h2 class="title">JW Assistant</h2><div class="card"><h3>Bible</h3><p>Your New World Translation can be saved on this device and read inside JW Assistant.</p><button class="btn" onclick="document.getElementById('tBible').checked=true">Open Bible</button></div></section><section id="Bible" class="view"><h2 class="title">Bible</h2><div class="actions"><button class="btn" onclick="pickBible()">Install / Replace Bible EPUB</button><button class="btn" onclick="testBible()">Test Bible</button></div><div id="bibleStatus" class="status">Checking Bible…</div><div class="scripture"><h3>Hebrew Scriptures</h3><div id="ot" class="bookgrid"></div></div><div class="scripture"><h3>Greek Scriptures</h3><div id="nt" class="bookgrid"></div></div></section><section id="Library" class="view"><h2 class="title">Publications</h2></section><section id="Meetings" class="view"><h2 class="title">Meetings</h2><div class="list"><a class="row" href="https://www.jw.org/en/library/jw-meeting-workbook/" target="_blank">Life and Ministry Meeting</a><a class="row" href="https://www.jw.org/en/library/magazines/watchtower-study/" target="_blank">Watchtower Study</a></div></section><section id="Study" class="view"><h2 class="title">Study</h2></section><section id="More" class="view"><h2 class="title">More</h2><div class="list"><a class="row" href="https://www.jw.org/" target="_blank">JW.ORG</a></div></section></main><nav class="nav"><label for="tHome"><b>⌂</b>Home</label><label for="tBible"><b>▤</b>Bible</label><label for="tLib"><b>▥</b>Library</label><label for="tMeet"><b>♙</b>Meetings</label><label for="tStudy"><b>✎</b>Study</label><label for="tMore"><b>•••</b>More</label></nav></div><div id="chapterPane" class="pane"><div class="ptop"><button onclick="closePane('chapterPane')">‹</button><strong id="chapterTitle"></strong></div><div id="chapters" class="chapters"></div></div><div id="readerPane" class="pane"><div class="ptop"><button onclick="closePane('readerPane')">‹</button><strong id="readerTitle"></strong><button onclick="speakReader()" style="font-size:14px">▶ Read</button></div><div id="readerBody" class="reader"></div></div><input id="bibleFile" class="file" type="file" accept=".epub,application/epub+zip"><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>const $=id=>document.getElementById(id),DB='jwassistant-bible-v4';let zip=null,books=[];const FULL=['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles','2 Chronicles','Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes','Song of Solomon','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi','Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation'];function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function putBible(v){const d=await openDB();return new Promise((ok,no)=>{const t=d.transaction('files','readwrite');t.objectStore('files').put(v,'bible');t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}async function getBible(){const d=await openDB();return new Promise((ok,no)=>{const r=d.transaction('files').objectStore('files').get('bible');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function ensureZip(){if(zip)return zip;if(!window.JSZip)throw Error('Bible reader did not load. Make sure you are online, tap Update, then try again.');const buf=await getBible();if(!buf)throw Error('Bible is not installed. Choose nwt_E.epub.');zip=await JSZip.loadAsync(buf);return zip}async function text(path){const z=await ensureZip(),p=path.replace(/^OEBPS\//,'');const f=z.file('OEBPS/'+p)||z.file(p);if(!f)throw Error('File not found inside EPUB: '+p);return f.async('string')}async function loadBooks(){const s=await text('biblebooknav.xhtml'),d=new DOMParser().parseFromString(s,'text/html'),links=[...d.querySelectorAll('a[href]')].slice(0,66);if(links.length<66)throw Error('This does not look like the New World Translation EPUB.');books=links.map((a,i)=>({abbr:a.textContent.trim(),full:FULL[i],href:a.getAttribute('href'),i}));$('ot').innerHTML='';$('nt').innerHTML='';books.forEach(b=>{const x=document.createElement('button');x.className='book';x.textContent=b.abbr;x.type='button';x.addEventListener('click',()=>openBook(b));$(b.i<39?'ot':'nt').appendChild(x)})}function pickBible(){$('bibleFile').value='';$('bibleFile').click()}$('bibleFile').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{$('bibleStatus').textContent='Installing '+f.name+'…';const buf=await f.arrayBuffer();await putBible(buf);zip=null;await ensureZip();await loadBooks();$('bibleStatus').textContent='✓ Bible installed and ready • '+f.name}catch(err){$('bibleStatus').textContent='Bible install failed: '+err.message;alert(err.message)}});async function openBook(b){try{if(!b)throw Error('Book not found.');if(!/biblechapternav/i.test(b.href)){return openChapter(b,b.href,'1')}const s=await text(b.href),d=new DOMParser().parseFromString(s,'text/html'),links=[...d.querySelectorAll('a[href]')].filter(a=>/^\d+$/.test(a.textContent.trim()));if(!links.length)throw Error('No chapters found for '+b.full);$('chapterTitle').textContent=b.full;$('chapters').innerHTML='';links.forEach(a=>{const n=a.textContent.trim(),x=document.createElement('button');x.textContent=n;x.addEventListener('click',()=>openChapter(b,a.getAttribute('href'),n));$('chapters').appendChild(x)});$('chapterPane').classList.add('on')}catch(err){$('bibleStatus').textContent='Could not open '+(b?.full||'book')+': '+err.message;alert(err.message)}}async function openChapter(b,href,n){$('chapterPane').classList.remove('on');$('readerPane').classList.add('on');$('readerTitle').textContent=b.full+' '+n;$('readerBody').textContent='Opening…';try{const s=await text(href),d=new DOMParser().parseFromString(s,'text/html');d.querySelectorAll('script,style,link,.w_navigation').forEach(x=>x.remove());$('readerBody').innerHTML=d.body?d.body.innerHTML:d.documentElement.textContent}catch(err){$('readerBody').textContent='Could not open chapter: '+err.message}}function closePane(id){$(id).classList.remove('on')}function speakReader(){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance($('readerBody').innerText))}async function testBible(){try{await ensureZip();if(!books.length)await loadBooks();await openBook(books[0])}catch(err){$('bibleStatus').textContent=err.message;alert(err.message)}}(async()=>{try{const b=await getBible();if(b){$('bibleStatus').textContent='Bible found. Loading books…';await ensureZip();await loadBooks();$('bibleStatus').textContent='✓ Bible installed and ready'}else{$('bibleStatus').textContent='Bible not installed. Tap Install / Replace Bible EPUB and choose nwt_E.epub.'}}catch(err){$('bibleStatus').textContent='Bible setup error: '+err.message}})();</script></body></html>
