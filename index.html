<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f486d"><meta name="apple-mobile-web-app-capable" content="yes"><title>JW Assistant</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f3f5;color:#30343a}.app{height:100dvh;display:flex;flex-direction:column}.top{background:#2f486d;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center}.top h1{margin:0;flex:1;font-size:21px}.update,.btn{border:0;border-radius:8px;padding:10px 12px;font-weight:700}.update{background:#ffffff18;color:#fff;border:1px solid #ffffff55}.btn{background:#324e73;color:#fff}.main{flex:1;overflow:auto}.tab{position:absolute;opacity:0;pointer-events:none}.view{display:none}#tHome:checked~.main #Home,#tBible:checked~.main #Bible,#tLib:checked~.main #Library,#tMeet:checked~.main #Meetings,#tStudy:checked~.main #Study,#tMore:checked~.main #More{display:block}.title{margin:0;padding:16px}.card{margin:0 16px 14px;background:#fff;border-radius:12px;padding:14px}.card h3{margin:0 0 10px}.form{display:flex;gap:8px}.form input{flex:1;min-width:0;padding:11px;border:1px solid #ccd3d9;border-radius:8px;font-size:16px}.quickrow{display:flex;align-items:center;gap:8px;border-top:1px solid #eee;padding:9px 0}.quickopen{flex:1;border:0;background:transparent;text-align:left;color:#1c56b3;font-weight:700}.quickdel{border:0;border-radius:7px;padding:7px;background:#eee}.actions{padding:0 16px 12px}.status{padding:11px 16px;background:#eef4f8;color:#365d7f;font-size:13px}.scripture{background:#fff;padding:18px 16px 8px}.scripture h3{font:700 23px Georgia,serif;margin:0 0 12px}.bookgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding-bottom:10px}.book{border:0;background:transparent;padding:0;text-align:left;color:#1c56b3;text-decoration:underline;font:18px Georgia,serif}.list{background:#fff}.row{display:block;padding:14px 16px;border-bottom:1px solid #eee;color:inherit;text-decoration:none}.nav{display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border-top:1px solid #ccc;padding-bottom:env(safe-area-inset-bottom)}.nav label{text-align:center;padding:8px 1px;font-size:10px;color:#69717a;touch-action:manipulation}.nav b{display:block;font-size:20px}#tHome:checked~.nav label[for=tHome],#tBible:checked~.nav label[for=tBible],#tLib:checked~.nav label[for=tLib],#tMeet:checked~.nav label[for=tMeet],#tStudy:checked~.nav label[for=tStudy],#tMore:checked~.nav label[for=tMore]{color:#2f6fa8}.pane{position:fixed;inset:0;background:#fff;z-index:20;display:none;flex-direction:column}.pane.on{display:flex}.ptop{background:#2f486d;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;display:flex;align-items:center;gap:8px}.ptop button{border:0;background:transparent;color:#fff;font-size:25px}.ptop strong{flex:1}.chapters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:18px}.chapters button{padding:13px;border:1px solid #ccd3d9;background:#fff;border-radius:8px;color:#316b9c;font-weight:700}.reader{flex:1;overflow:auto;padding:18px;font:18px/1.55 Georgia,serif}.reader .w_navigation{display:none!important}.file{display:none}@media(max-width:420px){.book{font-size:17px}.bookgrid{gap:9px 7px}}</style></head><body><div class="app"><header class="top"><h1>JW Assistant</h1><button class="update" onclick="location.reload()">Update</button></header><input class="tab" type="radio" name="tabs" id="tHome" checked><input class="tab" type="radio" name="tabs" id="tBible"><input class="tab" type="radio" name="tabs" id="tLib"><input class="tab" type="radio" name="tabs" id="tMeet"><input class="tab" type="radio" name="tabs" id="tStudy"><input class="tab" type="radio" name="tabs" id="tMore"><main class="main"><section id="Home" class="view"><h2 class="title">JW Assistant</h2><div class="card"><h3>Quick Verses</h3><div class="form"><input id="verseInput" placeholder="Example: John 3:16"><button class="btn" onclick="addVerse()">Add</button></div><div id="verseList"></div></div><div class="card"><h3>Publications</h3><button class="btn" onclick="document.getElementById('pubFile').click()">+ Add Publication</button><input id="pubFile" class="file" type="file" accept=".epub,application/epub+zip"></div></section><section id="Bible" class="view"><h2 class="title">Bible</h2><div class="actions"><button class="btn" onclick="pickBible()">Install / Replace Bible EPUB</button></div><div id="bibleStatus" class="status">Checking saved Bible…</div><div class="scripture"><h3>Hebrew Scriptures</h3><div id="ot" class="bookgrid"></div></div><div class="scripture"><h3>Greek Scriptures</h3><div id="nt" class="bookgrid"></div></div></section><section id="Library" class="view"><h2 class="title">Publications</h2><div id="pubStatus" class="status">Add a publication from Home for now.</div></section><section id="Meetings" class="view"><h2 class="title">Meetings</h2><div class="list"><a class="row" href="https://www.jw.org/en/library/jw-meeting-workbook/" target="_blank">Life and Ministry Meeting</a><a class="row" href="https://www.jw.org/en/library/magazines/watchtower-study/" target="_blank">Watchtower Study</a></div></section><section id="Study" class="view"><h2 class="title">Study</h2></section><section id="More" class="view"><h2 class="title">More</h2><div class="list"><a class="row" href="https://www.jw.org/" target="_blank">JW.ORG</a></div></section></main><nav class="nav"><label for="tHome"><b>⌂</b>Home</label><label for="tBible"><b>▤</b>Bible</label><label for="tLib"><b>▥</b>Library</label><label for="tMeet"><b>♙</b>Meetings</label><label for="tStudy"><b>✎</b>Study</label><label for="tMore"><b>•••</b>More</label></nav></div><div id="chapterPane" class="pane"><div class="ptop"><button onclick="closePane('chapterPane')">‹</button><strong id="chapterTitle"></strong></div><div id="chapters" class="chapters"></div></div><div id="readerPane" class="pane"><div class="ptop"><button onclick="closePane('readerPane')">‹</button><strong id="readerTitle"></strong><button onclick="speak(document.getElementById('readerBody').innerText)" style="font-size:14px">▶ Read</button></div><div id="readerBody" class="reader"></div></div><input id="bibleFile" class="file" type="file" accept=".epub,application/epub+zip"><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>const BOOKS=[['Gen.','Genesis','biblechapternav1.xhtml','ot'],['Ex.','Exodus','biblechapternav2.xhtml','ot'],['Lev.','Leviticus','biblechapternav3.xhtml','ot'],['Num.','Numbers','biblechapternav4.xhtml','ot'],['Deut.','Deuteronomy','biblechapternav5.xhtml','ot'],['Josh.','Joshua','biblechapternav6.xhtml','ot'],['Judg.','Judges','biblechapternav7.xhtml','ot'],['Ruth','Ruth','biblechapternav8.xhtml','ot'],['1 Sam.','1 Samuel','biblechapternav9.xhtml','ot'],['2 Sam.','2 Samuel','biblechapternav10.xhtml','ot'],['1 Ki.','1 Kings','biblechapternav11.xhtml','ot'],['2 Ki.','2 Kings','biblechapternav12.xhtml','ot'],['1 Chron.','1 Chronicles','biblechapternav13.xhtml','ot'],['2 Chron.','2 Chronicles','biblechapternav14.xhtml','ot'],['Ezra','Ezra','biblechapternav15.xhtml','ot'],['Neh.','Nehemiah','biblechapternav16.xhtml','ot'],['Esther','Esther','biblechapternav17.xhtml','ot'],['Job','Job','biblechapternav18.xhtml','ot'],['Ps.','Psalms','biblechapternav19.xhtml','ot'],['Prov.','Proverbs','biblechapternav20.xhtml','ot'],['Eccl.','Ecclesiastes','biblechapternav21.xhtml','ot'],['Song of Sol.','Song of Solomon','biblechapternav22.xhtml','ot'],['Isa.','Isaiah','biblechapternav23.xhtml','ot'],['Jer.','Jeremiah','biblechapternav24.xhtml','ot'],['Lam.','Lamentations','biblechapternav25.xhtml','ot'],['Ezek.','Ezekiel','biblechapternav26.xhtml','ot'],['Dan.','Daniel','biblechapternav27.xhtml','ot'],['Hos.','Hosea','biblechapternav28.xhtml','ot'],['Joel','Joel','biblechapternav29.xhtml','ot'],['Amos','Amos','biblechapternav30.xhtml','ot'],['Obad.','Obadiah','1001061135.xhtml','ot'],['Jonah','Jonah','biblechapternav32.xhtml','ot'],['Mic.','Micah','biblechapternav33.xhtml','ot'],['Nah.','Nahum','biblechapternav34.xhtml','ot'],['Hab.','Habakkuk','biblechapternav35.xhtml','ot'],['Zeph.','Zephaniah','biblechapternav36.xhtml','ot'],['Hag.','Haggai','biblechapternav37.xhtml','ot'],['Zech.','Zechariah','biblechapternav38.xhtml','ot'],['Mal.','Malachi','biblechapternav39.xhtml','ot'],['Matt.','Matthew','biblechapternav40.xhtml','nt'],['Mark','Mark','biblechapternav41.xhtml','nt'],['Luke','Luke','biblechapternav42.xhtml','nt'],['John','John','biblechapternav43.xhtml','nt'],['Acts','Acts','biblechapternav44.xhtml','nt'],['Rom.','Romans','biblechapternav45.xhtml','nt'],['1 Cor.','1 Corinthians','biblechapternav46.xhtml','nt'],['2 Cor.','2 Corinthians','biblechapternav47.xhtml','nt'],['Gal.','Galatians','biblechapternav48.xhtml','nt'],['Eph.','Ephesians','biblechapternav49.xhtml','nt'],['Phil.','Philippians','biblechapternav50.xhtml','nt'],['Col.','Colossians','biblechapternav51.xhtml','nt'],['1 Thess.','1 Thessalonians','biblechapternav52.xhtml','nt'],['2 Thess.','2 Thessalonians','biblechapternav53.xhtml','nt'],['1 Tim.','1 Timothy','biblechapternav54.xhtml','nt'],['2 Tim.','2 Timothy','biblechapternav55.xhtml','nt'],['Titus','Titus','biblechapternav56.xhtml','nt'],['Philem.','Philemon','1001061161.xhtml','nt'],['Heb.','Hebrews','biblechapternav58.xhtml','nt'],['Jas.','James','biblechapternav59.xhtml','nt'],['1 Pet.','1 Peter','biblechapternav60.xhtml','nt'],['2 Pet.','2 Peter','biblechapternav61.xhtml','nt'],['1 John','1 John','biblechapternav62.xhtml','nt'],['2 John','2 John','1001061167.xhtml','nt'],['3 John','3 John','1001061168.xhtml','nt'],['Jude','Jude','1001061169.xhtml','nt'],['Rev.','Revelation','biblechapternav66.xhtml','nt']].map(x=>({abbr:x[0],full:x[1],href:x[2],section:x[3]}));const DB='jwassistant-files-v3';let zip=null,pendingBook=null;function closePane(id){document.getElementById(id).classList.remove('on')}function renderBooks(){for(const b of BOOKS){const x=document.createElement('button');x.className='book';x.textContent=b.abbr;x.onclick=()=>openBook(b);document.getElementById(b.section).appendChild(x)}}function db(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function put(k,v){const d=await db();return new Promise((ok,no)=>{const t=d.transaction('files','readwrite');t.objectStore('files').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function get(k){const d=await db();return new Promise((ok,no)=>{const r=d.transaction('files').objectStore('files').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function pickBible(book=null){pendingBook=book;const f=document.getElementById('bibleFile');f.value='';f.click()}document.getElementById('bibleFile').onchange=async e=>{const f=e.target.files[0];if(!f){pendingBook=null;return}try{document.getElementById('bibleStatus').textContent='Installing Bible…';await put('bible',await f.arrayBuffer());zip=null;await ensureZip();document.getElementById('bibleStatus').textContent='✓ Bible installed offline • '+f.name;const b=pendingBook;pendingBook=null;if(b)setTimeout(()=>openBook(b),50)}catch(err){pendingBook=null;document.getElementById('bibleStatus').textContent='Bible install failed. Choose nwt_E.epub again.';alert(err.message)}};async function ensureZip(){if(zip)return zip;if(!window.JSZip)throw Error('Reader component not loaded. Connect once and reload.');const buf=await get('bible');if(!buf)throw Error('Choose nwt_E.epub first.');zip=await JSZip.loadAsync(buf);return zip}async function fileText(path){const z=await ensureZip(),clean=path.replace(/^OEBPS\//,'');const f=z.file('OEBPS/'+clean)||z.file(clean);if(!f)throw Error('EPUB file not found: '+path);return await f.async('string')}async function openBook(b){try{const installed=await get('bible');if(!installed){document.getElementById('bibleStatus').textContent='Choose nwt_E.epub to install the Bible, then this book will open.';pickBible(b);return}if(!/biblechapternav/i.test(b.href)){await openChapter(b,b.href,'1');return}const s=await fileText(b.href),d=new DOMParser().parseFromString(s,'application/xhtml+xml');const links=[...d.querySelectorAll('a[href]')].filter(a=>/^\d+$/.test(a.textContent.trim()));chapterTitle.textContent=b.full;chapters.innerHTML='';links.forEach(a=>{const n=a.textContent.trim(),btn=document.createElement('button');btn.textContent=n;btn.onclick=()=>openChapter(b,a.getAttribute('href'),n);chapters.appendChild(btn)});chapterPane.classList.add('on')}catch(e){document.getElementById('bibleStatus').textContent='Could not open '+b.full+'. Tap Install / Replace Bible EPUB and choose nwt_E.epub.';alert(e.message)}}async function openChapter(b,href,ch){closePane('chapterPane');readerPane.classList.add('on');readerTitle.textContent=b.full+' '+ch;readerBody.textContent='Opening…';try{const s=await fileText(href),d=new DOMParser().parseFromString(s,'text/html');d.querySelectorAll('script,style,link,.w_navigation').forEach(x=>x.remove());d.querySelectorAll('a[href="biblebooknav.xhtml"],a[href^="biblechapternav"]').forEach(x=>x.remove());readerBody.innerHTML=d.body?.innerHTML||d.documentElement.textContent}catch(e){readerBody.textContent=e.message}}function speak(t){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}function loadVerses(){const a=JSON.parse(localStorage.getItem('quickVerses')||'[]');verseList.innerHTML='';a.forEach((v,i)=>{const r=document.createElement('div');r.className='quickrow';r.innerHTML='<button class="quickopen">'+v.replace(/</g,'&lt;')+'</button><button class="quickdel">Remove</button>';r.children[0].onclick=()=>{document.getElementById('tBible').checked=true};r.children[1].onclick=()=>{a.splice(i,1);localStorage.setItem('quickVerses',JSON.stringify(a));loadVerses()};verseList.appendChild(r)})}function addVerse(){const v=verseInput.value.trim();if(!v)return;const a=JSON.parse(localStorage.getItem('quickVerses')||'[]');a.push(v);localStorage.setItem('quickVerses',JSON.stringify(a));verseInput.value='';loadVerses()}document.getElementById('pubFile').onchange=e=>{const f=e.target.files[0];if(f){localStorage.setItem('lastPubName',f.name);document.getElementById('pubStatus').textContent='Added: '+f.name}};renderBooks();loadVerses();(async()=>{try{bibleStatus.textContent=await get('bible')?'✓ Bible saved offline on this device':'Bible not installed yet. Tap Install / Replace Bible EPUB and choose nwt_E.epub.'}catch(e){bibleStatus.textContent='Bible storage check failed.'}const p=localStorage.getItem('lastPubName');if(p)pubStatus.textContent='Added: '+p})();</script></body></html>
