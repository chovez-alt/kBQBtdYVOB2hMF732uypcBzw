<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f486d"><meta name="apple-mobile-web-app-capable" content="yes"><title>JW Assistant</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#f2f3f5}body{overflow:hidden}</style></head><body><iframe id="app" src="/index.html" title="JW Assistant"></iframe><script>
const f=document.getElementById('app');
f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;if(!d)return;const quick=d.querySelector('#Home .card h3');if(quick)quick.textContent='Bible Verse Shortcuts';if(d.getElementById('homePubShortcuts'))return;const home=d.getElementById('Home');if(!home)return;const cards=home.querySelectorAll('.card');const pubCard=cards[1]||null;const box=d.createElement('div');box.className='card';box.id='homePubShortcuts';box.innerHTML='<h3>Publication Shortcuts</h3><div style="display:flex;gap:8px;margin-bottom:10px"><select id="homePubPick" style="flex:1;min-width:0;padding:11px;border:1px solid #ccd3d9;border-radius:8px;font-size:16px"><option value="lff">Enjoy Life Forever!</option><option value="lffi">Enjoy Life Forever!—Brochure</option></select><button id="homePubAdd" class="btn">Add</button></div><div id="homePubList"></div>';
if(pubCard)home.insertBefore(box,pubCard);else home.appendChild(box);
const names={lff:'Enjoy Life Forever!',lffi:'Enjoy Life Forever!—Brochure'};
function render(){const list=d.getElementById('homePubList'),ids=JSON.parse(w.localStorage.getItem('pubShortcuts')||'[]');list.innerHTML='';ids.forEach((id,i)=>{const r=d.createElement('div');r.style.cssText='display:flex;align-items:center;gap:8px;border-top:1px solid #eee;padding:9px 0';const o=d.createElement('button');o.textContent=names[id]||id;o.style.cssText='flex:1;border:0;background:transparent;text-align:left;color:#1c56b3;font-weight:700';o.onclick=()=>w.openPub&&w.openPub(id);const x=d.createElement('button');x.textContent='Remove';x.style.cssText='border:0;border-radius:7px;padding:7px;background:#eee';x.onclick=()=>{ids.splice(i,1);w.localStorage.setItem('pubShortcuts',JSON.stringify(ids));render()};r.append(o,x);list.appendChild(r)})}
d.getElementById('homePubAdd').onclick=()=>{const id=d.getElementById('homePubPick').value,ids=JSON.parse(w.localStorage.getItem('pubShortcuts')||'[]');ids.push(id);w.localStorage.setItem('pubShortcuts',JSON.stringify(ids));render()};render();
});
</script></body></html>
